spring.application.name=tienda-modulith
spring.jpa.open-in-view=false

# Muestra en consola cuándo se registra, completa o queda pendiente la publicación de un evento.
logging.level.org.springframework.modulith.events=DEBUG

# Outbox: al reiniciar la app, reintenta automáticamente los eventos que quedaron pendientes
# en la tabla EVENT_PUBLICATION (por ejemplo, porque el listener falló la última vez).
spring.modulith.events.republish-outstanding-events-on-restart=true

# Métricas: expone /actuator/prometheus para que Prometheus (ver docker-compose.yml) las recolecte.
management.endpoints.web.exposure.include=health,prometheus,metrics
management.prometheus.metrics.export.enabled=true
management.metrics.tags.application=${spring.application.name}

# spring-boot-docker-compose levanta docker-compose.yml solo al arrancar la app (./mvnw spring-boot:run).
# "start-only" en vez del default "start-and-stop": si reinicias la app para el demo del outbox,
# Prometheus/Grafana se quedan arriba en vez de bajar y volver a subir en cada reinicio.
spring.docker.compose.lifecycle-management=start-only
